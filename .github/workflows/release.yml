name: release

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: install poetry
        run: pipx install poetry

      - name: install dependencies
        run: poetry install

      - name: build
        run: make build

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Resume
          body: "Automated build from ${{ github.sha }}"
          files: rendercv_output/*.pdf
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: remove assets of deleted resumes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r asset; do
            if [ ! -f "rendercv_output/$asset" ]; then
              gh release delete-asset latest "$asset" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done
